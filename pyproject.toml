[project]
name = "release2mqtt"
readme = "README.md"

[tool.black]
line-length = 128

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "tests",
]
norecursedirs = [
    ".git",
    "templates",
]
pythonpath = [
  "."
]

addopts = [
    "--import-mode=importlib",
    "--cov-report=xml:cov.xml",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov=release2mqtt",
    "--cov-fail-under=0"
]